<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Log - Pen & Play Club</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="sales_log-style.css">
</head>
<body>
    <!-- Loader -->
    <div id="pageLoader" class="page-loader">
        <div class="loader-spinner"></div>
    </div>

    <div class="container">
        <header>
            <div class="header-content">
                <div class="burger-menu-container">
                    <div class="burger-icon" id="burgerIcon">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
                <div class="header-text">
                    <h1>Pen & Play Club</h1>
                    <p class="subtitle">Sales Log</p>
                </div>
                <div class="header-logo-right">
                    <img src="Logo.png" alt="Shop Logo">
                </div>
            </div>
        </header>

        <div class="burger-overlay" id="burgerOverlay"></div>
        <div class="burger-menu" id="burgerMenu">
            <nav>
                <a href="entry.html" data-num="01">New Entry</a>
                <a href="history.html" data-num="02">History</a>
                <a href="expense.html" data-num="03">Expenses</a>
                <a href="rent_income.html" data-num="04">Rent Income</a>
                <a href="statement.html" data-num="05">Statement</a>
                <a href="storage.html" data-num="06">Manage Storage</a>
                <a href="outofstock.html" data-num="07">Out of Stock</a>
                <a href="passport_photo_generator.html" data-num="08">Passport Photo</a>
                <a href="collage.html" data-num="09">Collage</a>
                <a href="generate_bill.html" data-num="10">Generate Bill</a>
                <a href="sales_log.html" data-num="11">Sales Log</a>
                <button id="darkModeToggle" class="dark-mode-toggle-btn">🌙 Dark Mode</button>
            </nav>
        </div>

        <main>
            <div class="back-to-dashboard">
                <a href="index.html">« Back To Dashboard</a>
            </div>

            <!-- Month Indicator -->
            <div class="month-indicator"><span class="mi-label">Viewing Month:</span> <span id="currentMonthLabel" class="mi-value">Loading...</span></div>

            <!-- Capture Form -->
            <div class="form-section">
                <h2>Capture Diary Page</h2>
                <form id="captureForm">
                    <!-- Date -->
                    <div class="form-group">
                        <label for="salesDate">Date</label>
                        <input type="date"
                               id="salesDate"
                               name="salesDate"
                               required>
                    </div>

                    <!-- Photos -->
                    <div class="form-group">
                        <label>Diary Page Photo(s)</label>
                        <div class="photo-capture-row">
                            <label for="salesImages" class="photo-capture-btn" id="photoCaptureBtn">
                                📷 Add Photo(s)
                            </label>
                            <input type="file" id="salesImages" name="salesImages" accept="image/*" multiple hidden>
                            <button type="button" id="photoClearBtn" class="photo-clear-btn hidden">✕ Remove All</button>
                        </div>
                        <div id="photoPreview" class="photo-preview hidden">
                            <div id="photoPreviewGrid" class="photo-preview-grid"></div>
                            <div class="photo-preview-meta">
                                <span id="photoCountLabel"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Extract Button -->
                    <button type="submit" class="btn-primary" id="extractBtn">
                        Extract Sales
                    </button>
                </form>

                <!-- Status Message -->
                <div id="statusMessage" class="status-message"></div>

                <!-- Review Section (hidden until first extraction) -->
                <div id="reviewSection" class="review-section hidden">
                    <h3>Review & Correct</h3>
                    <div id="reviewTable" class="review-list"></div>
                    <div class="review-actions">
                        <button type="button" class="add-row-btn" id="addRowBtn">+ Add Row</button>
                        <button type="button" class="btn-primary" id="saveSalesBtn">Save Sales Log</button>
                    </div>
                </div>
            </div>

            <!-- Sales Log History -->
            <div class="history-section">
                <div class="history-header">
                    <h2>Sales Log History</h2>
                </div>

                <div id="salesLogHistory" class="sales-log-list">
                    <div class="loading-spinner">Loading sales log...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Day View Modal -->
    <div id="dayViewModal" class="day-view-modal hidden">
        <div class="day-view-card">
            <div class="day-view-header">
                <h3 id="dayViewTitle">Items</h3>
                <button type="button" class="day-view-close" id="dayViewClose" aria-label="Close">✕</button>
            </div>
            <div id="dayViewList" class="day-view-list"></div>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="sales_log.js"></script>
    <!-- Vercel Speed Insights -->
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
