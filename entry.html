<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Cash Register</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="burger-menu-container">
                    <div class="burger-icon" id="burgerIcon">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
                <div class="header-text">
                    <h1>Pen & Play Club</h1>
                    <p class="subtitle">Daily Cash Register</p>
                </div>
                <div class="header-logo-right">
                    <img src="Logo.png" alt="Shop Logo">
                </div>
            </div>
        </header>

        <div class="burger-overlay" id="burgerOverlay"></div>
        <div class="burger-menu" id="burgerMenu">
            <nav>
                <a href="entry.html" data-num="01">New Entry</a>
                <a href="history.html" data-num="02">History</a>
                <a href="expense.html" data-num="03">Expenses</a>
                <a href="rent_income.html" data-num="04">Rent Income</a>
                <a href="statement.html" data-num="05">Statement</a>
                <a href="storage.html" data-num="06">Manage Storage</a>
                <a href="outofstock.html" data-num="07">Out of Stock</a>
                <a href="passport_photo_generator.html" data-num="08">Passport Photo</a>
                <a href="collage.html" data-num="09">Collage</a>
                <a href="generate_bill.html" data-num="10">Generate Bill</a>
                <button id="darkModeToggle" class="dark-mode-toggle-btn">Dark Mode</button>
            </nav>
        </div>

        <main>
            <div class="back-to-dashboard">
                <a href="index.html">« Back To Dashboard</a>
            </div>

            <form id="cashRegisterForm">
                <!-- Date Field -->
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <!-- Drawer Cash -->
                <div class="form-group">
                    <label for="cashAmount">Drawer Cash</label>
                    <input type="number"
                           id="cashAmount"
                           name="cashAmount"
                           placeholder="0.00"
                           step="0.01"
                           min="0"
                           inputmode="decimal">
                </div>

                <!-- Yesterday's Petty Cash (Read-only) -->
                <div class="form-group readonly-group">
                    <label for="yesterdayPettyCash">Yesterday's Petty Cash</label>
                    <input type="text"
                           id="yesterdayPettyCash"
                           readonly
                           value="0.00">
                </div>

                <!-- Today's Cash (Auto-calculated, Read-only) -->
                <div class="form-group readonly-group">
                    <label for="cashTotal">Today's Cash</label>
                    <input type="text"
                           id="cashTotal"
                           readonly
                           value="0.00">
                </div>

                <!-- UPI Amount -->
                <div class="form-group">
                    <label for="upiAmount">UPI Amount</label>
                    <input type="number"
                           id="upiAmount"
                           name="upiAmount"
                           placeholder="0.00"
                           step="0.01"
                           min="0"
                           inputmode="decimal">
                </div>

                <!-- Card Amount -->
                <div class="form-group">
                    <label for="cardAmount">Card Amount</label>
                    <input type="number"
                           id="cardAmount"
                           name="cardAmount"
                           placeholder="0.00"
                           step="0.01"
                           min="0"
                           inputmode="decimal">
                </div>

                <!-- AP Cash -->
                <div class="form-group">
                    <label for="apCash">AP Cash</label>
                    <input type="number"
                           id="apCash"
                           name="apCash"
                           placeholder="0.00"
                           step="0.01"
                           min="0"
                           inputmode="decimal">
                </div>

                <!-- Petty Cash Amount (Auto-calculated, Read-only) -->
                <div class="form-group readonly-group">
                    <label for="pettyCashAmount">Petty Cash Amount</label>
                    <input type="text"
                           id="pettyCashAmount"
                           readonly
                           value="0.00">
                </div>

                <!-- Total Income (Auto-calculated) -->
                <div class="form-group total-group">
                    <label for="totalIncome">Total Income</label>
                    <input type="text"
                           id="totalIncome"
                           readonly
                           value="0.00">
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-primary" id="submitBtn">
                    Save Entry
                </button>
            </form>

            <!-- Status Message -->
            <div id="statusMessage" class="status-message"></div>
        </main>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
    <!-- Vercel Speed Insights -->
    <script>
        window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
